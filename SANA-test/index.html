<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SANA-test</title>
<link rel="stylesheet" href="wipe.css">
<style>
.wrap{width:min(1240px,100% - 32px)}
body{font-size:15px}
header.hero{padding:52px 0 8px}
h1{margin:12px 0 6px;font-size:clamp(2rem,4vw,2.9rem)}
.sub{margin:0;color:var(--body);font-size:1.08rem;font-weight:600}
.lede{max-width:820px;margin:10px 0 0;color:var(--muted);font-size:.95rem}
.blockhead{display:flex;align-items:baseline;gap:10px;margin:34px 0 12px}
.blockhead h2{margin:0;color:var(--ink);font-size:1.15rem;letter-spacing:.01em}
#concl{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.ccard{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--body);text-decoration:none;line-height:1.6;transition:border-color .15s,box-shadow .15s,transform .15s}
.ccard:hover{border-color:var(--accent);box-shadow:0 10px 30px rgba(20,24,30,.08);transform:translateY(-1px)}
.cnum{flex:none;display:grid;width:28px;height:28px;place-items:center;border-radius:9px;background:var(--accent);color:#fff;font-weight:800;font-size:.9rem}
#plan{display:flex;gap:14px;align-items:flex-start;margin-top:12px;padding:14px 18px;border:1px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--accent) 6%,var(--paper));color:var(--body)}
#plan b{color:var(--accent-ink);white-space:nowrap}
.hint2{margin:30px 0 10px;color:var(--muted);font-size:.85rem}
details.sec{margin:14px 0 0;border:1px solid var(--line);border-radius:18px;background:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.03);scroll-margin-top:14px;overflow:hidden}
details.sec[open]{box-shadow:var(--shadow)}
details.sec>summary{display:flex;gap:16px;align-items:center;padding:18px 22px;cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.num{flex:none;display:grid;min-width:40px;height:40px;padding:0 8px;place-items:center;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:1.05rem}
.appendix .num{background:var(--muted);font-size:.8rem}
.stitle{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.stitle b{color:var(--ink);font-size:clamp(1.05rem,1.8vw,1.3rem);line-height:1.35}
.stitle small{color:var(--muted);font-size:.86rem;line-height:1.5}
.chev{flex:none;width:12px;height:12px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-right:6px}
details.sec[open]>summary .chev{transform:rotate(225deg)}
.sbody{padding:0 22px 24px}
.seclede{max-width:900px;margin:0 0 6px;color:var(--muted)}
.subhead{display:flex;gap:10px;align-items:baseline;margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line);scroll-margin-top:14px}
.subhead h3{margin:0;color:var(--ink);font-size:1.05rem}
.subhead span{color:var(--muted);font-size:.8rem}
.sublede{margin:3px 0 0;color:var(--muted);font-size:.88rem}
.viewer{margin-top:12px}
.vrow{display:grid;grid-template-columns:minmax(0,3fr) minmax(250px,2fr);gap:18px;align-items:start}
.stage{margin:0;padding:0;border-radius:12px;background:none;box-shadow:none}
.wipe{border-radius:10px}
.bar{margin-top:8px}
.vside{display:flex;flex-direction:column;gap:10px;min-width:0}
.vside .meta{display:block;margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vside .count{color:var(--muted);font-size:.78rem}
.vside .title{margin:6px 0 4px;color:var(--ink);font-size:.95rem;line-height:1.4}
.vside .caption{margin:0;color:var(--muted);font-size:.8rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.picker{max-height:300px;overflow:auto;padding:2px}
.picker .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{border-radius:10px}
.card img{aspect-ratio:16/9}
.card .ct{display:block;padding:5px 8px 7px;color:var(--body);font-size:.74rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card:hover{transform:none}
details.more{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
details.more>summary{color:var(--accent-ink);font-weight:700;font-size:.9rem;cursor:pointer}
.notes{margin-top:10px;padding:14px 18px;border-radius:12px;background:var(--bg);box-shadow:none;font-size:.9rem}
.notes h3{margin:12px 0 6px;color:var(--ink);font-size:.98rem}.notes h3:first-child{margin-top:0}
.notes ul{margin:4px 0 0;padding-left:20px}.notes li{margin:4px 0}
.notes table{border-collapse:collapse;margin:6px 0;font-size:.86rem}
.notes th,.notes td{padding:4px 12px;border-bottom:1px solid var(--line);text-align:left}
.brief{margin:4px 0 0;padding:0 0 0 20px;max-width:900px}
.brief li{margin:7px 0}
.modes{flex-wrap:wrap}
footer{padding:28px 0 56px}
@media (max-width:900px){.vrow{grid-template-columns:1fr}.picker{max-height:240px}.picker .grid{grid-template-columns:repeat(3,minmax(0,1fr))}#concl{grid-template-columns:1fr}}
@media (max-width:560px){.picker .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sbody{padding:0 14px 18px}details.sec>summary{padding:14px}}
</style>
<script>window.MEDIA_BASE = 'https://huggingface.co/datasets/Sensen02/SANA-test-assets/resolve/main/media/'; window.DATA_BASE = 'data/';</script>
</head>
<body>
<header class="hero wrap">
  <span class="kicker">SANA-Video · IC Refiner · 第 10000 步</span>
  <h1>SANA-test</h1>
  <p class="sub">SANA-Refiner 测试报告</p>
  <p class="lede">先看结论；点击结论或下方各节标题展开对应的对比视频。每个对比：左右拖动分割线，双击设定放大中心，右侧选样例。</p>
  <div class="blockhead"><h2>结论</h2></div>
  <div id="concl"></div>
  <div id="plan"></div>
  <p class="hint2">各节默认收起，点标题展开。</p>
</header>
<main class="wrap" id="sections"></main>
<footer class="wrap">对比视频上下两半分别是左右两侧的画面，每侧 2560×1440，5 秒（120 帧，24 fps）。SANA-Refiner 推理：LQ 视频作为 in-context token，从 σ=1 起 30 步 Euler（shift 12，CFG 1），文本只用视频描述。</footer>
<script src="wipe.js"></script>
</body>
</html>
