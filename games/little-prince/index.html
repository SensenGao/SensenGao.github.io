<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#23314f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Two Small Worlds — a Little Prince fan homage</title>
<meta name="description" content="A calm watercolour 3D story game in two chapters: Asteroid B-612 and The Fox. Unofficial fan homage inspired by The Little Prince by Antoine de Saint-Exupéry.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=0.3.0">
</head>
<body>
<canvas id="c" tabindex="0" aria-label="game"></canvas>
<div id="ui">
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-star">✦</div>
      <div class="loader-title"><span class="en">Two Small Worlds</span><span class="zh">两个小小的世界</span></div>
      <div class="loader-bar"><div id="loaderFill"></div></div>
      <div class="loader-text"><span id="loaderMsg">Painting the stars… · 正在描绘星星……</span> <span id="loaderPct">0%</span></div>
      <div class="loader-homage">Inspired by <i>The Little Prince</i> by Antoine de Saint-Exupéry. Unofficial fan project.<br>灵感来自安托万·德·圣埃克苏佩里的《小王子》。非官方同人作品。</div>
      <div id="loaderErr"></div>
    </div>
  </div>
</div>
<script>
// Real-progress loader for the game bundle (sizes are written in at build time).
(function () {
  var BUNDLE = 'game.js?v=0.3.0', SIZE = 963707;
  var fill = document.getElementById('loaderFill'), pct = document.getElementById('loaderPct');
  window.__loadProgress = function (p) { p = Math.max(0, Math.min(1, p)); fill.style.width = (p * 100).toFixed(1) + '%'; pct.textContent = Math.round(p * 100) + '%'; };
  function fail(msg) { document.getElementById('loaderErr').textContent = msg; }
  window.addEventListener('error', function (e) { if (!window.__gameStarted) fail('Error: ' + (e.message || e)); });
  fetch(BUNDLE).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (!r.body || !window.ReadableStream) return r.text();
    var reader = r.body.getReader(), chunks = [], got = 0;
    function pump() {
      return reader.read().then(function (res) {
        if (res.done) { var b = new Blob(chunks); return b.text(); }
        chunks.push(res.value); got += res.value.length; window.__loadProgress(0.45 * Math.min(1, got / SIZE));
        return pump();
      });
    }
    return pump();
  }).then(function (code) {
    window.__loadProgress(0.45);
    var url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    return import(url);
  }).catch(function (e) { fail('Could not load the game (' + e.message + '). Please reload. · 加载失败，请刷新页面。'); });
})();
</script>
</body>
</html>
